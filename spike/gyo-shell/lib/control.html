<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- Deliberately no referrer policy: this document sends a Referer, unlike
       the spike page. Loaded by app.js as the control for check A. -->
  <title>referer control</title>
  <style>
    body { margin: 8px; background: #222; color: #ddd; font: 13px system-ui, sans-serif; }
    img { max-width: 100%; display: block; }
  </style>
</head>
<body>
  <p id="out">loading…</p>
  <script>
    const src = new URLSearchParams(location.search).get('src');
    const image = new Image();
    const report = (result) =>
      fetch('/__echo')
        .then((response) => response.json())
        .then((headers) => {
          parent.postMessage(
            { source: 'referer-control', result, referer: headers.referer || '(none)' },
            location.origin,
          );
        });
    image.onload = () => {
      document.body.append(image);
      report(`loaded ${image.naturalWidth}x${image.naturalHeight}`);
    };
    image.onerror = () => report('blocked');
    image.src = src;
  </script>
</body>
</html>
