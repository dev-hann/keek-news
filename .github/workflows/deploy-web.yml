name: Deploy web app

# The web app is a static site on Cloudflare (web/wrangler.jsonc). A change to it under web/ is
# checked, built and deployed; the installed apps load the new version on their next launch, so
# no new APK is needed for a change to the web app.

on:
  push:
    branches: [master]
    paths:
      - web/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order: the last one to finish is the newest.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # What the pre-push hook runs: lint, format check, typecheck, tests, build.
      - run: npm run check
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The version this repository deploys with by hand (web/README.md).
        run: npx --yes wrangler@4.169.0 deploy
